name: 기능
description: 기능 명세의 한 항목을 작업 단위로 만든다
labels: [feature]
body:
  - type: input
    id: spec
    attributes:
      label: 기능 명세 ID
      description: 예) S2 자격 판정
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 무엇이 되면 끝인지 확인할 수 있게 적는다
      placeholder: "- [ ] 예시 프로필로 지원 가능/확인 필요/지원 불가와 이유가 보인다"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options: [backend, frontend, pipeline, docs]
    validations:
      required: true
