server:
  # Render는 PORT(기본 10000)를 넣어 준다. 로컬은 8080
  port: ${PORT:8080}

spring:
  application:
    name: coop-radar
  datasource:
    # 기본값은 로컬 docker compose(Postgres 18, 로컬 전용 계정). Render는 DB_URL·DB_USER·DB_PASSWORD를 넣는다(README 'DB')
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coopradar}
    username: ${DB_USER:coopradar}
    password: ${DB_PASSWORD:coopradar}
  flyway:
    # 앱이 뜰 때 V*.sql을 순서대로 적용한다(ADR-0010). 이미 적용한 파일은 고치지 않고 다음 번호를 새로 만든다
    locations: classpath:db/migration

springdoc:
  # Swagger UI 드롭다운에 스펙 두 개(ADR-0011)
  #  계약 = docs/api로 만든 정적 파일(static/openapi/contract.json, scripts/build_openapi.py가 생성) — 26개 전부
  #  구현 = springdoc이 지금 컨트롤러에서 만든 것(/v3/api-docs) — 구현된 것만
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 계약
        url: /openapi/contract.json
      - name: 구현
        url: /v3/api-docs
    urls-primary-name: 계약
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    # 쉼표로 구분. 프론트 배포 주소(Cloudflare Pages)를 Render 환경변수 CORS_ORIGINS에 넣는다
    allowed-origin-patterns: ${CORS_ORIGINS:http://localhost:5173}
  spike:
    model: ${SPIKE_MODEL:claude-sonnet-5-5}
    max-tokens: ${SPIKE_MAX_TOKENS:16000}
  replay:
    # 시연 기본 기준일(GET /api/rounds/current의 replay.defaultAsOf, 10/5 7/18 → 7/23 — ADR-0019).
    # 실제 사용자가 담은 수는 이 날 생긴 관심으로 더한다. 현재 회차 모집기간 밖이면 가까운 끝 날짜로 맞춘다
    default-as-of: ${REPLAY_DEFAULT_AS_OF:2026-07-23}
  reason:
    # 추천 이유 문장(docs/api #16). 키가 비면 LLM을 부르지 않고 기본 문장(TEMPLATE)으로 답한다
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${REASON_MODEL:claude-haiku-4-5-20251001}
    timeout: 5s
    per-user-per-hour: 30
    per-ip-per-hour: 60
    cache-size: 2000
  explore:
    # 직무 탐색(docs/api #28~#32, ADR-0031). 키가 비면 AI를 부르지 않고 규칙 추천(source RULE, NO_KEY)으로 답한다.
    # 모델은 sonnet급이어야 한다(E7: haiku는 키워드보다 Hit@1이 낮음)
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${EXPLORE_MODEL:claude-sonnet-5-5}
    # AI 호출 하나(탐색 순서, '왜 맞나요' 한 곳)의 제한 시간. E7 실측 5~7초
    timeout: 30s
    # 탐색 1번(순서 + 상위 3곳 설명)과 '왜 맞나요' 1곳이 각각 1회. 넘으면 규칙 추천·why null(LIMITED)
    per-user-per-hour: ${EXPLORE_PER_USER_PER_HOUR:10}
    per-ip-per-hour: ${EXPLORE_PER_IP_PER_HOUR:60}
    # 서버 전체 하루(한국 시간 자정에 새로 셈). 0이면 끔
    per-day: ${EXPLORE_PER_DAY:300}
  center:
    # 현황판 위험 요인 NARROW_POOL: 선호 전공 재학생 수가 이 값보다 적으면 표시(2026-2 시드 분포로 정함, ADR-0016)
    narrow-pool-below: ${CENTER_NARROW_POOL_BELOW:200}
  auth:
    # 로그인(ADR-0008·0012). JWT_SECRET이 비면 서버가 뜰 때마다 임시 키를 만든다(로컬 전용 — 다시 뜨면 로그인이 풀림)
    jwt-secret: ${JWT_SECRET:}
    member-ttl: 7d
    guest-ttl: 24h
    # 체험 계정 만들기 IP당 1시간 한도. 시연장·학교 와이파이는 여러 명이 한 IP라 넉넉히. 0이면 제한 없음(ADR-0013)
    guest-per-ip-per-hour: ${GUEST_PER_IP_PER_HOUR:300}
    # Render(*.onrender.com)는 Cloudflare를 거친다. 다른 곳에 배포하면 바꾸거나 비운다(비우면 연결 주소)
    client-ip-header: ${CLIENT_IP_HEADER:CF-Connecting-IP}
  commute:
    # 통근 조회(docs/api #18, ADR-0007). 카카오 주소 검색(출발·도착 좌표) + 대중교통 길찾기를 그때 부르고 결과는 저장하지 않는다
    kakao-url: https://dapi.kakao.com
    # 카카오 디벨로퍼스 REST API 키. 비면 카카오를 부르지 않고 available false(PROVIDER_ERROR)로 답한다
    kakao-key: ${KAKAO_REST_API_KEY:}
    # 카카오 호출 하나의 제한 시간(주소 검색 둘은 동시에, 길찾기는 그다음)
    timeout: 3s
    per-user-per-hour: 30
    # 통근 조회 횟수. 대중교통은 카카오 무료 하루 1,000건 안에서 서버가 먼저 멈춘다(한국 시간 자정에 새로 셈).
    # 주소 검색은 조회 1번에 1~3건이고 무료가 API마다 하루 10만 건이라 따로 세지 않는다
    per-day: 900
    # 사는 곳이 없을 때 출발점: 서경대(서울 성북구 서경로 124). 위키백과 Seokyeong University 문서 좌표 37°36′54″N 127°00′47″E.
    # 카카오 결과가 아니라서 설정에 둘 수 있다
    school:
      lat: 37.615
      lng: 127.0131
  example-profile:
    # [예시 프로필로 시작]이 저장하는 시연용 가상 학생. 학과는 department 시드에서 이름으로 찾는다.
    # 사는 곳은 area 시드(행정표준코드, pipeline/seed/areas.py)에 없으면 비운다
    department-name: 메이크업디자인학과
    grade: 3
    completed-semesters: 5
    gpa: 3.4
    graduation-expected: false
    interest-text: 뷰티 브랜드 SNS 마케팅
    home-area-code: "11350"
    # 가진 자격증(certificate 코드표의 code). 비우면 '자격증 없음' — 필수 자격증 직무가 지원 불가로 보인다(ADR-0021)
    certificates: []
