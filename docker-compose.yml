# 로컬 개발용 Postgres. Render 무료 Postgres(기본 최신 18)와 같은 메이저 버전을 쓴다.
# bootRun 전에 `docker compose up -d`로 띄운다. 앱이 뜰 때 Flyway가 V1을 적용한다(ADR-0010).
# 처음부터 다시 만들려면 `docker compose down -v`(데이터까지 지움).
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: coopradar
      POSTGRES_USER: coopradar
      POSTGRES_PASSWORD: coopradar   # 로컬 전용 값
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
